name: reference stack

# The numerical stack on which the pins were recorded (numpy 1.26.4, scipy 1.13.1, astropy 6.1.3,
# Python 3.12), weekly and on request. Here the pins are compared within their tolerances: the
# bit-for-bit comparison (BLRFIT_STRICT_PINS=1) holds only with the BLAS build recorded in
# tests/data/pins_0.3.0.json, which pip wheels do not provide.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.13.1 astropy==6.1.3
          python -m pip install -e ".[test]"
          python -c "import numpy, scipy, astropy; print(numpy.__version__, scipy.__version__, astropy.__version__)"
      - name: Fast test suite
        run: python -m pytest -m "not slow and not network" -n auto -q -rs
