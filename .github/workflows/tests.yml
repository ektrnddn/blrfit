name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            stack: "numpy==1.26.4 scipy==1.13.1 astropy~=6.0"  # the numerical stack of the catalogue run (astropy 6.0 is the last for Python 3.9)
          - python-version: "3.12"
            stack: ""                                          # current releases
    env:
      OMP_NUM_THREADS: "1"          # the fits are small least-squares problems; BLAS threads only add overhead
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.stack }}" ]; then python -m pip install ${{ matrix.stack }}; fi
          python -m pip install -e ".[test]"
          python -c "import numpy, scipy, astropy; print(numpy.__version__, scipy.__version__, astropy.__version__)"
      - name: Run the fast test suite
        run: python -m pytest -m "not slow and not network" -q -rs
