[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blrfit"
version = "0.1.0"
description = "Broad AGN emission lines fitted against the narrow-line systemic velocity: offsets, profile classes, quality flags and velocity changes between epochs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ekaterine Dadiani", email = "edadiani@andrew.cmu.edu"}]
requires-python = ">=3.9"
keywords = ["AGN", "quasar", "broad emission lines", "spectroscopy", "DESI", "SDSS", "black hole binaries"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "astropy>=5.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
fetch = ["astroquery>=0.4.6", "fsspec>=2023.1", "aiohttp>=3.8", "requests>=2.28"]
desi = ["desispec"]
dust = ["dustmaps"]
test = ["pytest>=7", "healpy>=1.16"]

[project.scripts]
blrfit = "blrfit.cli:main"

[project.urls]
Repository = "https://github.com/ektrnddn/blrfit"

[tool.setuptools.packages.find]
include = ["blrfit*"]

[tool.setuptools.package-data]
"blrfit.templates" = ["*.txt", "*.fits", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation (the full synthetic grids, the Monte Carlo pulls, the Liu et al. 2014 anchor)",
    "network: needs access to the SDSS or DESI public servers",
]
