[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blrfit"
version = "0.3.0.dev0"
description = "Fit the broad Balmer lines of AGN spectra: offsets from the narrow-line reference, profile classes and quality flags"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ekaterine Dadiani", email = "edadiani@andrew.cmu.edu"}]
requires-python = ">=3.10"
keywords = ["AGN", "quasar", "broad emission lines", "spectroscopy", "DESI", "SDSS", "black hole binaries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# the oldest tested stack: numpy 1.26, scipy 1.13, astropy 6 (the reference stack of the pins)
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "astropy>=6.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
fetch = ["fsspec>=2023.1", "aiohttp>=3.8", "requests>=2.28"]
desi = ["desispec"]
dust = ["dustmaps"]
test = ["pytest>=7", "healpy>=1.16", "requests>=2.28"]

[project.scripts]
blrfit = "blrfit.cli:main"

[project.urls]
Homepage = "https://github.com/ektrnddn/blrfit"
Documentation = "https://github.com/ektrnddn/blrfit#readme"
Issues = "https://github.com/ektrnddn/blrfit/issues"
Changelog = "https://github.com/ektrnddn/blrfit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["blrfit*"]

[tool.setuptools.package-data]
"blrfit.templates" = ["*.txt", "*.fits", "README.md"]

[tool.ruff]
line-length = 110
# the uncertainty-study sources are pinned by SHA256 in validation/*/STUDY_IDENTITY.json
extend-exclude = ["validation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# zip() over sequences of equal length by construction; strict=True would add checks, not fix errors
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation (the full synthetic grids, the Monte Carlo pulls, the Liu et al. 2014 anchor)",
    "network: needs access to the SDSS or DESI public servers",
]
